name: Windows app

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build Flightpath.exe
        run: python tools/build_windows.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Flightpath-Windows
          path: dist/Flightpath.exe
          if-no-files-found: error
      - name: Attach executable to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Flightpath.exe
